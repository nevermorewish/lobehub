server {
    listen 80;
    listen 443 ssl;
    http2 on;
    listen [::]:80;
    server_name s3.frogclaw.chat;

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/s3.frogclaw.chat.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/s3.frogclaw.chat/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/s3.frogclaw.chat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:S3SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;
    #SSL-END

    # 允许大文件上传
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # 关闭缓冲，直通 S3
        proxy_buffering off;
        proxy_request_buffering off;

        # CORS 由 RustFS 自行处理，Nginx 不重复添加
    }

    #一键申请SSL证书验证目录相关设置
    location /.well-known {
        allow all;
    }

    #LOG START
    access_log /www/wwwlogs/s3.frogclaw.chat.log;
    error_log /www/wwwlogs/s3.frogclaw.chat.error.log;
    #LOG END
}
