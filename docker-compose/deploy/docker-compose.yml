name: lobehub
services:
  lobe:
    image: crpi-dzjyl2rfnlfugj1m.cn-shanghai.personal.cr.aliyuncs.com/frogclaw/lobehub:latest
    container_name: lobehub
    ports:
      - '3210:3210'
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - 'KEY_VAULTS_SECRET=xJhL9PZ0RtBw4vVn8FmDq2QkKcY7sN5xWgTrEpHX6qA='
      - 'AUTH_SECRET=L9d1bK8mN5cVv7WxZq0XpFjR2nB6tYmH4vDcKxWgTrE='
      - 'APP_URL=https://frogclaw.chat'
      - 'DATABASE_URL=postgresql://postgres:uWNZugjBqixf8dxC@postgresql:5200/lobechat'
      - 'S3_ENDPOINT=https://tos-s3-cn-beijing.volces.com'
      - 'S3_BUCKET=huanxing'
      - 'S3_ENABLE_PATH_STYLE=1'
      - 'LLM_VISION_IMAGE_USE_BASE64=1'
      - 'S3_SET_ACL=0'
      - 'SEARXNG_URL=http://searxng:8080'
      - 'REDIS_URL=redis://redis:6200'
      - 'REDIS_PREFIX=lobechat'
      - 'REDIS_TLS=0'
      # Gateway Mode: agent runs execute on the server and stream to the browser
      # through the gateway service below. The browser-facing AGENT_GATEWAY_URL
      # comes from .env; server-to-gateway traffic stays on the Compose network.
      - 'ENABLE_AGENT_GATEWAY=1'
      - 'AGENT_GATEWAY_INTERNAL_URL=http://gateway:8787'
      - 'AGENT_GATEWAY_SERVICE_TOKEN=${GATEWAY_SERVICE_TOKEN:-}'
      - 'DEVICE_GATEWAY_SERVICE_TOKEN=${GATEWAY_SERVICE_TOKEN:-}'
    env_file:
      - .env
    restart: always
    networks:
      - lobe-network

  # Single-instance LobeHub gateway (https://github.com/lobehub/lobehub-gateway):
  # - 8787 agent gateway: relays Gateway Mode runs to browsers over WebSocket,
  #   so AGENT_GATEWAY_URL in .env must be reachable from the browser.
  # - 8788 device gateway: routes tool calls to devices joined with
  #   `lh connect --gateway <url>`.
  # State is kept in memory: runs in flight are lost when this container restarts.
  gateway:
    image: ghcr.io/lobehub/lobehub-gateway:0.3.2
    container_name: lobe-gateway
    ports:
      - '${AGENT_GATEWAY_PORT:-8787}:8787'
      - '${DEVICE_GATEWAY_PORT:-8788}:8788'
    environment:
      - 'SERVICE_TOKEN=${GATEWAY_SERVICE_TOKEN:-}'
      # Public key only: the private JWKS_KEY stays in the lobe container
      - 'JWKS_PUBLIC_KEY=${JWKS_PUBLIC_KEY:-}'
      - 'LOBE_API_BASE_URL=http://lobe:3210'
    restart: always
    networks:
      - lobe-network

  postgresql:
    image: paradedb/paradedb:latest-pg17
    container_name: lobe-postgres
    # Optional: Remove or change these ports if:
    # - You don't need external database access
    # - The ports conflict with other services on your host
    ports:
      - '5200:5200'
    volumes:
      - './data:/var/lib/postgresql/data'
    # Keep the image's default preload list: its first-start bootstrap creates the pg_cron
    # extension and aborts initialization when pg_cron is missing from this list.
    command: ['postgres', '-p', '5200', '-c', 'shared_preload_libraries=pg_search,pg_cron,pg_stat_statements']
    environment:
      - 'POSTGRES_DB=lobechat'
      - 'POSTGRES_PASSWORD=uWNZugjBqixf8dxC'
    healthcheck:
      # Probe over TCP: during first-time initialization the image runs a temporary server that
      # only listens on the Unix socket, so a socket probe reports ready while LobeHub's TCP
      # connections are still refused.
      test: ['CMD-SHELL', 'pg_isready -U postgres -h 127.0.0.1 -p 5200']
      interval: 5s
      timeout: 5s
      retries: 5
      # TCP stays closed until initialization finishes, which can outlast the retries above
      start_period: 60s
    restart: always
    networks:
      - lobe-network

  redis:
    image: redis:7-alpine
    container_name: lobe-redis
    # Optional: Remove or change these ports if:
    # - You don't need external access
    # - The ports conflict with other services on your host
    ports:
      - '6200:6200'
    command: redis-server --port 6200 --save 60 1000 --appendonly yes
    volumes:
      - 'redis_data:/data'
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '6200', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      - lobe-network

  searxng:
    image: searxng/searxng
    container_name: lobe-searxng
    volumes:
      - './searxng-settings.yml:/etc/searxng/settings.yml'
    environment:
      - 'SEARXNG_SETTINGS_FILE=/etc/searxng/settings.yml'
    restart: always
    networks:
      - lobe-network

networks:
  lobe-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
